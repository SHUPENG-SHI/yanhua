<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#b81c22">
<title>烟花登记 · 管理后台</title>
<link rel="stylesheet" href="assets/style.css">
</head>
<body>

<div class="login-wrap" id="loginView">
  <form class="login-card" id="loginForm">
    <h1>管理后台</h1>
    <p class="desc">烟花登记 · 仅管理员可登录</p>
    <input id="account" type="text" placeholder="账号 / 邮箱" autocomplete="username">
    <input id="password" type="password" placeholder="密码" autocomplete="current-password">
    <button class="btn primary" type="submit">登录</button>
    <div class="err" id="loginErr"></div>
    <a class="back" href="index.html">返回下单页</a>
  </form>
</div>

<div id="appView" hidden>
  <header class="topbar">
    <div class="brand">烟花登记 · 管理后台</div>
    <div class="sub" id="modeTip"></div>
    <button class="admin-link" id="logoutBtn" type="button">退出</button>
  </header>

  <div class="admin-wrap">
    <div class="tabs">
      <button type="button" data-tab="orders" class="on">订单管理</button>
      <button type="button" data-tab="products">商品库存</button>
    </div>

    <section id="tabOrders">
      <div class="summary-grid" id="summaryGrid"></div>

      <div class="panel">
        <div class="panel-head">
          <select id="periodSel">
            <option value="today">今日</option>
            <option value="month">本月</option>
            <option value="all">全部</option>
          </select>
          <div class="range">
            <input type="date" id="dateFrom">
            <span>至</span>
            <input type="date" id="dateTo">
          </div>
          <input type="search" id="nameFilter" placeholder="按姓名搜索">
          <select id="statusFilter">
            <option value="">全部状态</option>
            <option value="pending">已提交</option>
            <option value="adjusted">已调整</option>
            <option value="cancelled">已取消</option>
          </select>
          <div class="spacer"></div>
          <button class="btn ghost small" id="refreshBtn" type="button">刷新</button>
        </div>
        <div class="table-scroll">
          <table class="data">
            <thead>
              <tr>
                <th>提交时间</th><th>姓名</th><th>件数</th><th>总价</th>
                <th>优惠</th><th>最终价格</th><th>状态</th><th>备注</th><th>操作</th>
              </tr>
            </thead>
            <tbody id="orderBody"></tbody>
          </table>
        </div>
      </div>
    </section>

    <section id="tabProducts" hidden>
      <div class="panel">
        <div class="panel-head">
          <strong style="font-size:14px">商品与库存</strong>
          <span style="font-size:12px;color:#8b8378">成本列仅后台可见，顾客端不会出现</span>
          <div class="spacer"></div>
          <button class="btn ghost small" id="reloadProducts" type="button">刷新</button>
        </div>
        <div class="table-scroll">
          <table class="data table-edit">
            <thead>
              <tr>
                <th>序号</th><th>名称</th><th>单位</th><th>售价</th><th>成本</th>
                <th>库存</th><th>预警</th><th>星级</th><th>上架</th><th>操作</th>
              </tr>
            </thead>
            <tbody id="productBody"></tbody>
          </table>
        </div>
      </div>
    </section>
  </div>
</div>

<div class="modal" id="modal" hidden>
  <div class="modal-box">
    <div class="modal-head">
      <h3 id="modalTitle">订单详情</h3>
      <button class="x" id="modalClose" type="button">×</button>
    </div>
    <div class="modal-body" id="modalBody"></div>
    <div class="modal-foot" id="modalFoot"></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script src="assets/config.js"></script>
<script src="assets/util.js"></script>
<script src="assets/store.js"></script>
<script src="assets/vendor/xlsx.full.min.js"></script>
<script src="assets/admin.js"></script>
</body>
</html>
